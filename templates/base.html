<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Helpdesk{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'ticket_list' %}">Helpdesk</a>
      {% if user.is_authenticated %}
      <div class="d-flex align-items-center gap-3">
        <a class="nav-link text-light" href="{% url 'ticket_list' %}">Chamados</a>
        <a class="btn btn-sm btn-success" href="{% url 'ticket_create' %}">+ Novo chamado</a>
        <span class="text-light small">{{ user.get_full_name|default:user.username }}</span>
        <span class="badge text-bg-secondary">{{ current_role.label }}</span>
        <form method="post" action="{% url 'logout' %}" class="m-0">
          {% csrf_token %}
          <button class="btn btn-sm btn-outline-light" type="submit">Sair</button>
        </form>
      </div>
      {% endif %}
    </div>
  </nav>

  <main class="container pb-5">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
      </div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
