{% extends "base.html" %}
{% block title %}Entrar | Helpdesk{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Entrar</h1>
        <form method="post">
          {% csrf_token %}
          {% if form.errors %}
            <div class="alert alert-danger">Usuário ou senha inválidos.</div>
          {% endif %}
          <div class="mb-3">
            <label class="form-label" for="id_username">Usuário</label>
            <input class="form-control" type="text" name="username" id="id_username" autofocus required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="id_password">Senha</label>
            <input class="form-control" type="password" name="password" id="id_password" required>
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button class="btn btn-primary w-100" type="submit">Entrar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
